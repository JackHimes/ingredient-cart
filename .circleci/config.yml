# Use the latest 2.1 version of CircleCI pipeline process engine. See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

executors:
  default:
    machine:
      image: 'ubuntu-2204:edge'
      docker_layer_caching: true

# notfication job to send slack messages when job start
jobs:
  start_notify:
    docker:
      - image: ubuntu:18.04
    steps:
      - run: apt update && apt upgrade -y && apt install curl -y
      - slack/notify:
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "plain_text",
                    "text": "CircleCI Started for project $CIRCLE_PROJECT_REPONAME.",
                    "emoji": true
                  }
                }
              ]
            }
          event: always
          # NOTE: Test channel. Feel free to comment out to use default.
          #channel: C02L844RJ5R
# Use a package of configuration called an orb.
orbs:
  # Declare a dependency on the the orbs
  aws-ecr: circleci/aws-ecr@8.1.2
  aws-ecs: circleci/aws-ecs@3.0.0
  versioning: streamroot/versioning@0.1.1
  slack: circleci/slack@4.10.1
workflows:
  build:
    jobs:
      # notify slack that job started
      - start_notify:
          context: slack
      # build staging image for main branch only
      - aws-ecr/build-and-push-image:
          executor: default
          context:
            - aws
            - slack
            - npm
          name: build-staging
          filters:
            branches:
              ignore:
                - main
          pre-steps:
            - checkout
          requires:
            - start_notify
          create-repo: true
          repo: cartalk-reviews
          # replace any forward slashes in the branch name with -_-
          tag: 'staging-latest,${CIRCLE_BRANCH////-_-}.staging.$CIRCLE_WORKFLOW_ID'
          extra-build-args: '--build-arg DEPLOYMENT_ENV=test --build-arg GITHUB_TOKEN=$GITHUB_TOKEN --build-arg FONTAWESOME_TOKEN=$FONTAWESOME_TOKEN'
          #troubleshooting and slack notifications
          post-steps:
            - slack/notify:
                event: fail
                template: basic_fail_1
                channel: G01BFSHGU2G
            - slack/notify:
                event: pass
                template: basic_success_1
                channel: G01BFSHGU2G
      - aws-ecs/deploy-service-update:
          context:
            - aws
            - slack
          name: staging-deploy
          filters:
            branches:
              only:
                - staging
                - /^feature\/.*/
                - /^bugfix\/.*/
          requires:
            - build-staging
          family: 'reviews-staging'
          cluster: 'cartalk_prod_cluster'
          service-name: 'reviews-staging_TkuOCy7O'
          # replace any forward slashes in the branch name with -_-
          container-image-name-updates: 'container=reviews-staging,tag=${CIRCLE_BRANCH////-_-}.staging.$CIRCLE_WORKFLOW_ID'
          # slack notifications
          post-steps:
            - slack/notify:
                event: fail
                template: basic_fail_1
                channel: G01BFSHGU2G
            - slack/notify:
                event: pass
                template: basic_success_1
                channel: G01BFSHGU2G
      # build prod image for main branch only, on approval. that way, people can take the time to review
      # staging if needed
      - aws-ecr/build-and-push-image:
          executor: default
          context:
            - aws
            - slack
            - npm
          extra-build-args: '--build-arg DEPLOYMENT_ENV=production --build-arg GITHUB_TOKEN=$GITHUB_TOKEN --build-arg FONTAWESOME_TOKEN=$FONTAWESOME_TOKEN'
          name: build-prod
          filters:
            branches:
              only: main
          pre-steps:
            - checkout
          create-repo: true
          repo: cartalk-reviews
          # replace any forward slashes in the branch name with -_-
          tag: 'prod-latest,${CIRCLE_BRANCH////-_-}.prod.$CIRCLE_WORKFLOW_ID'
          #troubleshooting and slack notifications
          post-steps:
            - slack/notify:
                event: fail
                template: basic_fail_1
                channel: G01BFSHGU2G
            - slack/notify:
                event: pass
                template: basic_success_1
                channel: G01BFSHGU2G
      - aws-ecs/deploy-service-update:
          context:
            - aws
            - slack
          name: prod-deploy
          filters:
            branches:
              only: main
          requires:
            - build-prod
          family: 'reviews-prod'
          cluster: 'cartalk_prod_cluster'
          service-name: 'reviews-prod_pSleYVA2'
          # replace any forward slashes in the branch name with -_-
          container-image-name-updates: 'container=reviews-prod,tag=${CIRCLE_BRANCH////-_-}.prod.$CIRCLE_WORKFLOW_ID'
          # slack notifications
          post-steps:
            - slack/notify:
                event: fail
                template: basic_fail_1
                channel: G01BFSHGU2G
            - slack/notify:
                event: pass
                template: basic_success_1
                channel: G01BFSHGU2G